# Serves the MinIO S3 API at s3.jvm.my.id — the host the application signs
# photo URLs against. This is SEPARATE from the console at minio.jvm.my.id:
# the console (port 9001) answers HTML for every path, so a presigned object
# URL sent there returns a web page, not the object. The S3 API is a different
# port (MinIO's --address, default 9000) and must have its own host.
#
# Install on the server that runs MinIO:
#   sudo cp s3.jvm.my.id.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/s3.jvm.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# And point s3.jvm.my.id at that server in DNS (Cloudflare), and set
# MINIO_SERVER_URL=https://s3.jvm.my.id on the MinIO deployment.
#
# The one rule that must not be broken: preserve the Host header. A SigV4
# presigned URL signs the host it was signed for (s3.jvm.my.id), and MinIO
# validates the signature against the Host it receives — rewrite it and every
# photo URL fails with SignatureDoesNotMatch. The path and query are signed
# too, so leave them untouched.

server {
    listen 80;
    listen [::]:80;

    server_name s3.jvm.my.id;

    # Uploads land here as well when the app talks to the S3 API over the public
    # name; keep this above the app's own 10 MB request cap so the app's message
    # is what answers, not nginx.
    client_max_body_size 50m;

    location / {
        # The MinIO S3 API port on THIS server. It is not a fixed number — on
        # this box 9000 is Portainer and 9001 is the MinIO console, so the S3
        # API is elsewhere (9002 with `minio server --address :9002`). Confirm
        # which port answers with S3 XML before trusting this line:
        #   for p in 9000 9001 9002 9003; do echo -n "$p: "; \
        #     curl -s http://127.0.0.1:$p/ | head -c 45; echo; done
        #   # the one returning <?xml ...AccessDenied is the S3 API
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;

        # The signed host. Everything hinges on this being $host, not the
        # upstream's name.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Stream objects rather than buffering them to disk.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
