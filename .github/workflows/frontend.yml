name: Deploy Frontend CI/CD to Dev

# Only when the frontend changes: the Maven workflow already runs on everything
# else, and a bun install plus build on a backend-only commit buys nothing.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing run number to deploy, e.g. 41. Leave empty to build this commit. This is the rollback.'
        required: false
        default: ''
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

env:
  API_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/multitenancy-api
  FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/multitenancy-frontend

jobs:
  test:
    name: Lint and build
    runs-on: ubuntu-latest
    # A rollback names an image that already exists, so there is nothing
    # here to prove about it.
    if: ${{ inputs.image_tag == '' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than latest, so a bun release cannot break the build
          # on a commit that did not touch it.
          bun-version: 1.3.13

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Fails if bun.lock and package.json disagree, rather than quietly
      # resolving something the lockfile never described.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # next build type checks as part of the build, and every page that talks
      # to the API is server rendered on demand, so no backend is needed here.
      - name: Build
        run: bun run build

  check:
    name: Check the settings are all there
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      # Missing configuration should stop here, with the name of what is
      # missing, rather than eighty seconds later as a container that will not
      # start or — worse — a link mailed to a user pointing at nothing.
      - name: Every secret and variable this needs
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APPLICATION_JWT_SECRET: ${{ secrets.APPLICATION_JWT_SECRET }}
          APPLICATION_DATABASE_URL_TEMPLATE: ${{ vars.APPLICATION_DATABASE_URL_TEMPLATE }}
          APPLICATION_DATABASE_USER: ${{ vars.APPLICATION_DATABASE_USER }}
          APPLICATION_DATABASE_PASSWORD: ${{ secrets.APPLICATION_DATABASE_PASSWORD }}
          APPLICATION_STORAGE_ENDPOINT: ${{ vars.APPLICATION_STORAGE_ENDPOINT }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          missing=
          for name in SSH_HOST SSH_PORT SSH_USERNAME SSH_PRIVATE_KEY \
                      DOCKERHUB_USERNAME DOCKERHUB_TOKEN \
                      APPLICATION_JWT_SECRET APPLICATION_DATABASE_URL_TEMPLATE \
                      APPLICATION_DATABASE_USER APPLICATION_DATABASE_PASSWORD \
                      APPLICATION_STORAGE_ENDPOINT PUBLIC_BASE_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set, see docs/dev-deployment.md:$missing"
            exit 1
          fi

  images:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [ test, check ]
    # Skipped entirely when a tag to deploy was named, which is what makes
    # rolling back fast: the images already exist.
    if: ${{ needs.check.result == 'success' && !failure() && !cancelled() && inputs.image_tag == '' }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      # The run number alone. Each pipeline builds only its own image, into its
      # own repository, so the two counters cannot collide — api:7 and
      # frontend:7 are different images — and no prefix is needed.
      - name: Derive the image tag
        id: tag
        run: echo "tag=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the front end image is built here; the API has its own pipeline.
      # Three tags: the run number, which is what the server is told to run; the
      # commit it was built from, for tracing a deployed tag back to source; and
      # `dev`, a label for reading. Nothing is ever deployed by `dev` — it does
      # not say which build it was, so it cannot be rolled back to.
      - name: Build and push the front end image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_TENANT_BASE_DOMAIN=${{ vars.APPLICATION_TENANT_BASE_DOMAIN || 'jvm.my.id' }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to the dev server
    runs-on: ubuntu-latest
    needs: [ test, check, images ]
    # `always()` would deploy over a failed build; this runs when the images
    # were built or skipped because a tag was named, and not otherwise.
    if: ${{ needs.check.result == 'success' && !failure() && !cancelled() }}
    environment: dev

    # Shared with the other workflow's deploy job by name, so a push that
    # touches both sides deploys twice in a row rather than twice at once.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: Resolve which tag to deploy
        id: tag
        run: |
          tag="${{ inputs.image_tag }}"
          [ -n "$tag" ] || tag="${{ needs.images.outputs.tag }}"
          if [ -z "$tag" ]; then
            echo "::error::No image tag to deploy"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying $tag"

      # Written here rather than through a third party action: this key opens a
      # shell on the server, and the fewer things that handle it the better.
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trust on first use, every run: whatever answers is believed. Set
            # the SSH_KNOWN_HOSTS secret and this branch stops being taken —
            # see docs/dev-deployment.md for how to produce its value.
            echo "::warning::SSH_KNOWN_HOSTS is not set; the host key is being accepted unverified"
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # The fingerprint of the key that is about to be offered. It is the
          # public half, so it is safe to print, and it is the one thing that
          # tells a rejected key apart from a wrong one: compare it against
          # `ssh-keygen -lf ~deployer/.ssh/authorized_keys` on the server.
          ssh-keygen -lf ~/.ssh/id_deploy || echo "::warning::The key in SSH_PRIVATE_KEY could not be read at all"

      # Assembled on the runner and copied across, so no secret is ever an
      # argument to a remote command, where it would be visible in the server's
      # process list to anyone with a shell there.
      - name: Compose the server's .env
        env:
          # Suffixed rather than reusing the workflow level names, which would
          # be a step's env referring to itself.
          FRONTEND_IMAGE_REF: ${{ vars.DOCKERHUB_USERNAME }}/multitenancy-frontend:${{ steps.tag.outputs.tag }}
          BIND_ADDRESS: ${{ vars.BIND_ADDRESS || '127.0.0.1' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          APPLICATION_JWT_SECRET: ${{ secrets.APPLICATION_JWT_SECRET }}
          APPLICATION_DATABASE_URL_TEMPLATE: ${{ vars.APPLICATION_DATABASE_URL_TEMPLATE }}
          APPLICATION_DATABASE_USER: ${{ vars.APPLICATION_DATABASE_USER }}
          APPLICATION_DATABASE_PASSWORD: ${{ secrets.APPLICATION_DATABASE_PASSWORD }}
          APPLICATION_DATABASE_CENTRAL_DATABASE: ${{ vars.APPLICATION_DATABASE_CENTRAL_DATABASE || 'db_default' }}
          APPLICATION_TENANT_BASE_DOMAIN: ${{ vars.APPLICATION_TENANT_BASE_DOMAIN || 'jvm.my.id' }}
          APPLICATION_STORAGE_ENDPOINT: ${{ vars.APPLICATION_STORAGE_ENDPOINT }}
          APPLICATION_STORAGE_SIGNED_URL_ENDPOINT: ${{ vars.APPLICATION_STORAGE_SIGNED_URL_ENDPOINT }}
          APPLICATION_STORAGE_BUCKET: ${{ vars.APPLICATION_STORAGE_BUCKET || 'jvm-uploads' }}
          APPLICATION_STORAGE_ACCESS_KEY: ${{ secrets.APPLICATION_STORAGE_ACCESS_KEY }}
          APPLICATION_STORAGE_SECRET_KEY: ${{ secrets.APPLICATION_STORAGE_SECRET_KEY }}
          REDIS_HOST: ${{ vars.REDIS_HOST || 'host.docker.internal' }}
          REDIS_PORT: ${{ vars.REDIS_PORT || '6379' }}
          REDIS_TIMEOUT: ${{ vars.REDIS_TIMEOUT || '10000ms' }}
          REDIS_USERNAME: ${{ vars.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
        run: |
          umask 077
          {
            echo "# Written by .github/workflows/frontend.yml on $(date -u +%FT%TZ)."
            echo "# Edits here are overwritten on the next deploy: change the repository"
            echo "# secret or variable instead."
            echo
            echo "FRONTEND_IMAGE=$FRONTEND_IMAGE_REF"
            echo "BIND_ADDRESS=$BIND_ADDRESS"
            echo
            echo "APPLICATION_JWT_SECRET=$APPLICATION_JWT_SECRET"
            echo "APPLICATION_DATABASE_URL_TEMPLATE=$APPLICATION_DATABASE_URL_TEMPLATE"
            echo "APPLICATION_DATABASE_USER=$APPLICATION_DATABASE_USER"
            echo "APPLICATION_DATABASE_PASSWORD=$APPLICATION_DATABASE_PASSWORD"
            echo "APPLICATION_DATABASE_CENTRAL_DATABASE=$APPLICATION_DATABASE_CENTRAL_DATABASE"
            echo "APPLICATION_TENANT_BASE_DOMAIN=$APPLICATION_TENANT_BASE_DOMAIN"
            echo
            echo "APPLICATION_STORAGE_ENDPOINT=$APPLICATION_STORAGE_ENDPOINT"
            echo "APPLICATION_STORAGE_SIGNED_URL_ENDPOINT=$APPLICATION_STORAGE_SIGNED_URL_ENDPOINT"
            echo "APPLICATION_STORAGE_BUCKET=$APPLICATION_STORAGE_BUCKET"
            echo "APPLICATION_STORAGE_ACCESS_KEY=$APPLICATION_STORAGE_ACCESS_KEY"
            echo "APPLICATION_STORAGE_SECRET_KEY=$APPLICATION_STORAGE_SECRET_KEY"
            echo
            # A Redis that failed to start must fail the deployment rather than
            # leave every instance counting rate limits on its own.
            echo "APPLICATION_RATE_LIMIT_BACKEND=REDIS"
            echo "REDIS_HOST=$REDIS_HOST"
            echo "REDIS_PORT=$REDIS_PORT"
            echo "REDIS_TIMEOUT=$REDIS_TIMEOUT"
            # Empty when the Redis needs no auth, which the app reads as no
            # credential; set to reach a protected one.
            echo "REDIS_USERNAME=$REDIS_USERNAME"
            echo "REDIS_PASSWORD=$REDIS_PASSWORD"
            echo
            echo "BREVO_API_KEY=$BREVO_API_KEY"
            echo "BREVO_SENDER_EMAIL=$BREVO_SENDER_EMAIL"
            echo "BREVO_SENDER_NAME=$BREVO_SENDER_NAME"
            echo
            # The four links the backend mails out. They are read by a person in
            # a browser, so they have to name the public address of this
            # deployment and not a container port.
            echo "APPLICATION_INVITATION_ACCEPT_BASE_URL=$PUBLIC_BASE_URL/invitations"
            echo "APPLICATION_PASSWORD_RESET_BASE_URL=$PUBLIC_BASE_URL/reset-password"
            echo "APPLICATION_VERIFY_BASE_URL=$PUBLIC_BASE_URL/verify-email"
            echo "APPLICATION_EMAIL_CHANGE_BASE_URL=$PUBLIC_BASE_URL/confirm-email"
            echo
            echo "APP_ORIGIN=$APP_ORIGIN"
          } > .env.deploy

      - name: Copy the compose file and the environment across
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'multitenancy' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            "mkdir -p $DEPLOY_PATH"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes -P "$SSH_PORT" \
            deploy/compose.dev.yaml "$SSH_USERNAME@$SSH_HOST:$DEPLOY_PATH/compose.dev.yaml"
          scp -i ~/.ssh/id_deploy -o BatchMode=yes -P "$SSH_PORT" \
            .env.deploy "$SSH_USERNAME@$SSH_HOST:$DEPLOY_PATH/.env.incoming"
          # This pipeline owns only its own image line. The other service's tag
          # is preserved from the .env already on the server — or, on a first
          # deploy, read off its running container — so deploying one service
          # never rewrites which build the other is running.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          other=$(grep -E '^API_IMAGE=' .env 2>/dev/null | tail -1 || true)
          if [ -z "$other" ]; then
            img=$(docker inspect -f '{{.Config.Image}}' multitenancy-api 2>/dev/null || true)
            [ -n "$img" ] && other="API_IMAGE=$img"
          fi
          if [ -z "$other" ]; then
            echo "::error::cannot determine the current API_IMAGE to preserve"; exit 1
          fi
          { cat .env.incoming; echo "$other"; } > .env
          chmod 600 .env
          rm -f .env.incoming
          EOF

      - name: Pull and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'multitenancy' }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # The token arrives on the remote shell's stdin rather than in its
          # argument list, where `ps` would show it to anyone logged in.
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -i ~/.ssh/id_deploy -o BatchMode=yes -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

          # The script is expanded on the server, not here, so the only value
          # crossing over is the path — named on the command line rather than
          # interpolated into the script.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # Only the front end is named, so the api container is left as it is —
          # verified that `up -d frontend` does not recreate api. Plain
          # `up -d frontend` (not `--no-deps`) is used because this server's
          # compose v2.6.0 mishandles `--no-deps` with a health-conditioned
          # depends_on, leaving the new container created but not started.
          docker compose -f compose.dev.yaml pull frontend
          docker compose -f compose.dev.yaml up -d frontend
          docker image prune -f
          EOF

      - name: Wait for it to answer
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'multitenancy' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" bash -s <<'EOF'
          set -uo pipefail
          code=
          for attempt in $(seq 1 40); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/login || true)
            if [ "$code" = "200" ]; then
              echo "frontend answered after $((attempt * 5))s at most"
              exit 0
            fi
            sleep 5
          done
          echo "frontend still not healthy: $code"
          exit 1
          EOF

      - name: Show what is running, and the logs if it is not
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'multitenancy' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -p "$SSH_PORT" "$SSH_USERNAME@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          cd "$DEPLOY_PATH"
          docker compose -f compose.dev.yaml ps
          docker compose -f compose.dev.yaml logs --tail=60
          EOF

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_deploy .env.deploy
