# Production overrides. Activate with --spring.profiles.active=prod or
# SPRING_PROFILES_ACTIVE=prod.
#
# No default is supplied on purpose: an unset variable has to stop startup with
# "Could not resolve placeholder", not fall back to a value committed to this
# repository. Generate one with: openssl rand -base64 48
application.jwt.secret=${APPLICATION_JWT_SECRET}

# The database and storage credentials deserve the same treatment; they still
# carry development defaults in application.properties.
application.database.user=${APPLICATION_DATABASE_USER:root}
application.database.password=${APPLICATION_DATABASE_PASSWORD:root}
application.storage.access-key=${APPLICATION_STORAGE_ACCESS_KEY:}
application.storage.secret-key=${APPLICATION_STORAGE_SECRET_KEY:}
