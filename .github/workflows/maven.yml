# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # The dependency submission API writes a snapshot to the repository, which
    # the default read-only GITHUB_TOKEN is not allowed to do.
    permissions:
      contents: write

    # The application boots every tenant DataSource on startup, so the tests
    # need a reachable MySQL on localhost:3306 with the credentials from
    # src/main/resources/application.properties. Flyway creates the schemas.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # MinIO cannot be a service container: the image needs a "server /data"
    # command and services have no way to supply one. The storage tests upload
    # to it for real, so the endpoint, signing and path style settings are
    # covered rather than mocked.
    - name: Start MinIO
      run: |
        docker run -d --name minio \
          -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          minio/minio:latest server /data
        for attempt in $(seq 1 30); do
          if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
            echo "MinIO is up after ${attempt} attempt(s)"
            exit 0
          fi
          sleep 2
        done
        echo "MinIO never became healthy"
        docker logs minio
        exit 1

    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        # Turns a MinIO that failed to start into a build failure instead of a
        # silently skipped test.
        S3_INTEGRATION_REQUIRED: "true"

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8
