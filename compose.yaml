# Local development dependencies: the MySQL the tenants live in, and the S3
# compatible bucket the photos go to.
#
#   docker compose up -d
#
# The defaults here match src/main/resources/application.properties, so the
# application needs no extra configuration to use them.
#
# Note: MySQL binds host port 3306 and Redis binds 6379. If either is already
# installed and running on this machine, stop it or change the mapping here and
# point the matching setting at the new port.
services:

  mysql:
    image: mysql:8
    container_name: multitenancy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      # The application creates a database per tenant, so nothing is created here.
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: multitenancy-minio
    # The image has no default command; without this it exits immediately.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # S3 API, what the application talks to.
      - "9000:9000"
      # Web console, http://localhost:9001
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: multitenancy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the bucket once MinIO is up. The application does not create it, so
  # without this the first photo upload fails.
  minio-init:
    image: minio/mc:latest
    container_name: multitenancy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/jvm-uploads &&
      echo 'bucket jvm-uploads ready'
      "
    restart: "no"

  # The application itself, built from the Dockerfile. Behind a profile so that
  # "docker compose up -d" still brings up only the dependencies, which is what
  # you want while running the app from an IDE.
  #
  #   docker compose --profile app up -d --build
  app:
    build: .
    image: multitenancy:latest
    container_name: multitenancy-app
    profiles: [ "app" ]
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Inside the network the dependencies answer to their service names, not
      # to localhost.
      APPLICATION_DATABASE_URL_TEMPLATE: >-
        jdbc:mysql://mysql:3306/{database}?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      APPLICATION_STORAGE_ENDPOINT: http://minio:9000
      REDIS_HOST: redis
      # Development values, same as application.properties. Running the prod
      # profile here would refuse to start until real ones are supplied.
      APPLICATION_DATABASE_USER: root
      APPLICATION_DATABASE_PASSWORD: root
      APPLICATION_STORAGE_ACCESS_KEY: minioadmin
      APPLICATION_STORAGE_SECRET_KEY: minioadmin
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
  minio-data:
