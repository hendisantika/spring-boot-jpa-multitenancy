# Serves MinIO's S3 API at minio.jvm.my.id, which is the host the application
# signs photo URLs against (APPLICATION_STORAGE_SIGNED_URL_ENDPOINT).
#
#   sudo cp deploy/nginx/minio.jvm.my.id.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/minio.jvm.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This REPLACES any earlier minio.jvm.my.id block that pointed at the MinIO
# console (port 9002): the host now serves the S3 API (container 9000,
# published to 127.0.0.1:9000 by ~/minio/compose.yml). The console is no longer
# on this host — reach it over an SSH tunnel to 127.0.0.1:9002, or give it its
# own name.
#
# The one rule that must not be broken: preserve the Host header. A SigV4
# presigned URL signs the host it was signed for (minio.jvm.my.id), and MinIO
# validates the signature against the Host it receives — rewrite it and every
# photo URL fails with SignatureDoesNotMatch. Do not touch the path or the
# query string either; the signature covers both.

server {
    listen 80;
    listen [::]:80;

    server_name minio.jvm.my.id;

    # Presigned reads are the traffic here; uploads go straight to minio:9000
    # over the compose network, not through this. Kept generous so a large
    # object is never the thing nginx refuses.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;

        # The signed host. Everything hinges on this line being $host and not
        # the upstream's name.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Streaming large objects: let them flow rather than buffering to disk.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
