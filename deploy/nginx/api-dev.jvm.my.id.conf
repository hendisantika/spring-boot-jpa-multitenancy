# Back end of the dev deployment: api-dev.jvm.my.id -> the Spring Boot
# container on 127.0.0.1:8010.
#
#   sudo cp deploy/nginx/api-dev.jvm.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api-dev.jvm.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This route is NOT needed for the app to work: the front end calls the API
# from inside the Next server over the compose network, and the browser never
# touches it. It exists only to reach the API by hand — curl, a REST client,
# /actuator/health — from outside the box. Leave it uninstalled and the
# application is unaffected.
#
# TLS is terminated upstream, matching the rest of the box: plain :80, trust
# X-Forwarded-Proto. Single label under jvm.my.id, so one wildcard cert at the
# edge covers it alongside dev.jvm.my.id.

server {
    listen 80;
    listen [::]:80;

    server_name api-dev.jvm.my.id;

    # The API accepts a 5 MB photo inside a 10 MB request; stay above that so
    # the app's own limit is what answers, not nginx.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;

        # X-Tenant is deliberately passed through here, unlike on the front end.
        # This host carries no tenant subdomain, so the header is the only way a
        # direct caller can name one — and membership on the access token still
        # gates it, so allowing the header widens nothing a token would not.
        proxy_read_timeout 60s;
    }
}
