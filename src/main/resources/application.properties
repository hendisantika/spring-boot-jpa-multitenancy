# {database} is substituted per database: the central one and one per tenant.
application.database.url-template=jdbc:mysql://localhost:3306/{database}?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Jakarta&useSSL=false&allowPublicKeyRetrieval=true
application.database.user=root
application.database.password=root
# Holds the tenant registry and the memberships the parent login reads.
application.database.central-database=db_default
# Every tenant gets its own pool, so keep each one small.
application.database.maximum-pool-size=5
application.database.minimum-idle=0
application.database.idle-timeout=1m
# Tenant "sehat" is served from database `sehat` at sehat.jvm.my.id.
application.tenant.base-domain=jvm.my.id
# Migrations are driven per database by the application, not by Boot's single
# auto-configured Flyway instance.
spring.flyway.enabled=false

# Signing key for the tokens the parent login issues. DEVELOPMENT VALUE:
# override it outside development, for example with APPLICATION_JWT_SECRET.
# HS256 needs at least 32 bytes.
application.jwt.secret=${APPLICATION_JWT_SECRET:change-this-development-only-secret-please-32b}
application.jwt.issuer=jvm.my.id
application.jwt.access-token-ttl=30m
application.jwt.refresh-token-ttl=14d

# Profile and organization photos. Point the endpoint at MinIO locally, or leave
# it empty to use AWS S3 with the default credential chain.
application.storage.bucket=jvm-uploads
application.storage.region=us-east-1
application.storage.endpoint=${APPLICATION_STORAGE_ENDPOINT:http://localhost:9000}
application.storage.access-key=${APPLICATION_STORAGE_ACCESS_KEY:minioadmin}
application.storage.secret-key=${APPLICATION_STORAGE_SECRET_KEY:minioadmin}
application.storage.path-style-access=true
application.storage.max-file-size=5MB

# Photos arrive on the signup request, so multipart has to allow them through.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Only the health endpoint is exposed, and it reports UP or DOWN without
# details unless the caller is authorized, so probing it reveals nothing.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
# Separate liveness and readiness, which orchestrators probe differently.
management.endpoint.health.probes.enabled=true
