# {database} is substituted per database: the central one and one per tenant.
application.database.url-template=jdbc:mysql://localhost:3306/{database}?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
application.database.user=root
application.database.password=root
# Holds the tenant registry and the memberships the parent login reads.
application.database.central-database=db_default
# Every tenant gets its own pool, so keep each one small.
application.database.maximum-pool-size=5
application.database.minimum-idle=0
application.database.idle-timeout=1m
# Tenant "sehat" is served from database `sehat` at sehat.jvm.my.id.
application.tenant.base-domain=jvm.my.id
# Migrations are driven per database by the application, not by Boot's single
# auto-configured Flyway instance.
spring.flyway.enabled=false

# Signing key for the tokens the parent login issues. DEVELOPMENT VALUE:
# override it outside development, for example with APPLICATION_JWT_SECRET.
# HS256 needs at least 32 bytes.
application.jwt.secret=${APPLICATION_JWT_SECRET:change-this-development-only-secret-please-32b}
application.jwt.issuer=jvm.my.id
application.jwt.access-token-ttl=30m
application.jwt.refresh-token-ttl=14d

# Profile and organization photos. Point the endpoint at MinIO locally, or leave
# it empty to use AWS S3 with the default credential chain.
application.storage.bucket=jvm-uploads
application.storage.region=us-east-1
application.storage.endpoint=${APPLICATION_STORAGE_ENDPOINT:http://localhost:9000}
application.storage.access-key=${APPLICATION_STORAGE_ACCESS_KEY:minioadmin}
application.storage.secret-key=${APPLICATION_STORAGE_SECRET_KEY:minioadmin}
application.storage.path-style-access=true
application.storage.max-file-size=5MB

# Photos arrive on the signup request, so multipart has to allow them through.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Health and info are exposed. Health reports UP or DOWN without details unless
# the caller is authorized, so probing it reveals nothing; info is public on
# purpose, carrying the build and commit that are live so a deployment can be
# identified without a token — nothing an attacker gains from.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Separate liveness and readiness, which orchestrators probe differently.
management.endpoint.health.probes.enabled=true

# What /actuator/info carries. The build section comes from build-info.properties
# written by the Maven plugin; the git and app sections come from these, which
# the env contributor exposes — off by default since Spring Boot 2.6, hence the
# explicit enable. GIT_COMMIT and GIT_BRANCH are set in the image from build
# arguments and read at runtime; outside a built image they fall back to
# "unknown", which is the honest answer when there was no build to stamp.
management.info.env.enabled=true
management.info.build.enabled=true
management.info.java.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
info.git.branch=${GIT_BRANCH:unknown}
info.git.commit.id=${GIT_COMMIT:unknown}

# Invitations. There is no mail server wired up, so the accept link is returned
# to the owner to pass on; the token is stored only as a SHA-256 hash.
application.invitation.ttl=7d
application.invitation.accept-base-url=${APPLICATION_INVITATION_ACCEPT_BASE_URL:http://localhost:3000/invitations}

# Transactional email through Brevo. Leave the key empty and invitation links
# are returned to the owner to pass on instead of being emailed.
# The sender must be an address Brevo has verified for the account.
application.brevo.api-key=${BREVO_API_KEY:}
application.brevo.sender-email=${BREVO_SENDER_EMAIL:no-reply@jvm.my.id}
application.brevo.sender-name=${BREVO_SENDER_NAME:Multitenancy}

# Password reset. Short lived on purpose: the link is a way into the account.
application.password-reset.ttl=1h
application.password-reset.reset-base-url=${APPLICATION_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}

# Email verification. Only enforced when mail can actually be delivered: with no
# Brevo key, accounts are marked verified at signup instead of being locked out.
application.email-verification.ttl=24h
application.email-verification.verify-base-url=${APPLICATION_VERIFY_BASE_URL:http://localhost:3000/verify-email}

# Changing the address on an account. The change waits here until the link sent
# to the new mailbox is opened, so a typo cannot lock anybody out.
application.email-change.ttl=24h
application.email-change.confirm-base-url=${APPLICATION_EMAIL_CHANGE_BASE_URL:http://localhost:3000/confirm-email}

# Rate limiting for the endpoints that are open by necessity. Held in memory, so
# each instance allows this rate; it raises the cost of guessing rather than
# capping it across a cluster.
application.rate-limit.enabled=true
application.rate-limit.login.capacity=10
application.rate-limit.login.window=5m
application.rate-limit.forgot-password.capacity=5
application.rate-limit.forgot-password.window=15m
application.rate-limit.email-change.capacity=5
application.rate-limit.email-change.window=15m
application.rate-limit.password-change.capacity=10
application.rate-limit.password-change.window=5m
# AUTO uses Redis when it answers at startup, otherwise counts per instance.
# Set REDIS in production so a missing Redis is a failure rather than a quiet
# downgrade.
application.rate-limit.backend=${APPLICATION_RATE_LIMIT_BACKEND:AUTO}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
