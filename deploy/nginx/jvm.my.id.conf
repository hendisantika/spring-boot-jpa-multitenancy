# Serves every tenant subdomain from one server block.
#
# The application already resolves the tenant from the host name, so nothing
# here needs to change when an organization registers: `*.jvm.my.id` matches a
# name that did not exist a minute ago exactly as it matches one that did. That
# is the whole point of the wildcard — provisioning writes a row, and the name
# is already served.
#
#   cp deploy/nginx/jvm.my.id.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/jvm.my.id.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# See docs/wildcard-subdomain.md for the DNS records and the certificate this
# expects to find.

# Websocket-aware Connection header. Debian's nginx includes sites-enabled from
# inside the http block, so this belongs here; if the file is included from
# somewhere else, move it to conf.d and drop it from here — `map` is only legal
# in http context, and defining it twice is an error.
map $http_upgrade $http_connection_upgrade {
    default upgrade;
    ''      close;
}

# Only the front end is exposed. The browser never calls the Spring Boot API
# directly — Next.js reaches it server side over BACKEND_URL — so port 8080
# stays on the loopback interface and has no server block at all.
upstream multitenancy_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name jvm.my.id *.jvm.my.id;

    # The certificate is issued over DNS-01, so there is no ACME challenge to
    # serve here and everything can go straight to HTTPS. 308 rather than 301:
    # it keeps the method, so a redirected POST stays a POST.
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jvm.my.id *.jvm.my.id;

    # One certificate covers both names; a wildcard does not cover the apex it
    # descends from, which is why the apex is requested alongside it.
    ssl_certificate     /etc/letsencrypt/live/jvm.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jvm.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Without `preload`, and without `includeSubDomains` unless every other
    # name under this domain is also on HTTPS to stay — both are hard to walk
    # back, and a wildcard means the promise covers hosts that do not exist yet.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Photos are the largest thing that passes through. The real limits live in
    # the application — 5 MB per file, 6 MB per server action, 10 MB per backend
    # request — and this is deliberately above all of them so that an oversized
    # upload is refused with the application's message rather than nginx's 413.
    client_max_body_size 12m;

    location / {
        proxy_pass http://multitenancy_frontend;
        proxy_http_version 1.1;

        # $host, not $proxy_host: the tenant is the first label of the name the
        # browser asked for, and rewriting it here would erase it before the
        # application ever sees which clinic was meant.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The client's X-Tenant, if it sent one, is dropped rather than passed
        # on. The backend accepts that header in place of a subdomain, which is
        # what makes local development possible without wildcard DNS; on a
        # public port it would let a caller name a tenant the host name did not.
        proxy_set_header X-Tenant "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection_upgrade;

        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # Built assets are content addressed and safe to keep.
    location /_next/static/ {
        proxy_pass http://multitenancy_frontend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
