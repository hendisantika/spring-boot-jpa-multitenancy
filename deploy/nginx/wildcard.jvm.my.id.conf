# Tenant subdomains: every {slug}.jvm.my.id a registered clinic gets. One
# wildcard block serves all of them, so a clinic registered a minute ago is
# reachable with no per-tenant configuration — that is the whole point.
#
#   sudo cp wildcard.jvm.my.id.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/wildcard.jvm.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# In Cloudflare, add a PROXIED (orange) record so Universal SSL terminates TLS
# for *.jvm.my.id:
#   Type A   Name *   Content 165.22.246.205   Proxy: Proxied
#
# server_name is the wildcard ALONE. The explicit names on this box —
# dev.jvm.my.id, api-dev.jvm.my.id, minio.jvm.my.id, s3.jvm.my.id — keep their
# own blocks, and nginx matches an exact server_name before a wildcard, so this
# only ever catches a subdomain that has no block of its own. It does mean any
# undefined subdomain under jvm.my.id lands on the clinic front end; that is the
# cost of sharing the jvm.my.id namespace, and it is the arrangement chosen.
#
# TLS is terminated at Cloudflare, matching every other site here: plain :80,
# trust X-Forwarded-Proto.

server {
    listen 80;
    listen [::]:80;

    server_name *.jvm.my.id;

    # The initial hit on a tenant host is answered by the Next proxy with a
    # redirect to dev.jvm.my.id/organizations/{slug}; a 307 keeps the method, so
    # allow a body through in case that first request carried one.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # $host, not the upstream name: the slug is the first label of the host
        # the browser asked for, and the Next proxy reads it from here. Rewrite
        # it and the tenant is lost before the app ever sees which clinic.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        # Terminated at Cloudflare, so the scheme the app should believe in is
        # https regardless of the plain :80 this listens on.
        proxy_set_header X-Forwarded-Proto https;

        # The client's X-Tenant is dropped at this edge. The backend accepts it
        # in place of a subdomain, which is a development affordance; on a public
        # port it would let a visitor name a tenant the host did not.
        proxy_set_header X-Tenant "";

        proxy_read_timeout 60s;
    }
}
