# Production overrides. Activate with --spring.profiles.active=prod or
# SPRING_PROFILES_ACTIVE=prod.
#
# No defaults are supplied on purpose: an unset variable has to stop startup,
# not fall back to a value committed to this repository. Generate the JWT
# secret with: openssl rand -base64 48
application.jwt.secret=${APPLICATION_JWT_SECRET}

application.database.user=${APPLICATION_DATABASE_USER}
application.database.password=${APPLICATION_DATABASE_PASSWORD}

# These two may stay empty, which selects the AWS default credential chain and
# is how an instance running with an IAM role is configured. Set both or
# neither.
application.storage.access-key=${APPLICATION_STORAGE_ACCESS_KEY:}
application.storage.secret-key=${APPLICATION_STORAGE_SECRET_KEY:}
