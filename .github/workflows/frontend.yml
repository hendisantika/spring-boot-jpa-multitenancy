name: Deploy Frontend CI/CD to Dev

# Only when the frontend changes: the Maven workflow already runs on everything
# else, and a bun install plus build on a backend-only commit buys nothing.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned rather than latest, so a bun release cannot break the build
          # on a commit that did not touch it.
          bun-version: 1.3.13

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Fails if bun.lock and package.json disagree, rather than quietly
      # resolving something the lockfile never described.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # next build type checks as part of the build, and every page that talks
      # to the API is server rendered on demand, so no backend is needed here.
      - name: Build
        run: bun run build

  # Same as the backend: the dev server only ever sees a commit whose checks
  # passed, and a pull request deploys nothing.
  deploy:
    name: Deploy
    needs: [ build ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
