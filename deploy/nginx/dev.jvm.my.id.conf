# Front end of the dev deployment: dev.jvm.my.id -> the Next.js container on
# 127.0.0.1:5000.
#
#   sudo cp deploy/nginx/dev.jvm.my.id.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dev.jvm.my.id.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is terminated upstream (Cloudflare), the same as every other site on this
# box: the server blocks listen on plain :80 and trust X-Forwarded-Proto. If a
# day comes when this host faces the internet directly, add `listen 443 ssl`
# with a certificate and drop the hardcoded proto below — see the wildcard
# example in jvm.my.id.conf.
#
# The browser only ever talks to the front end. The API is reached from inside
# the Next server over the compose network, so it needs no route here; the
# companion api-dev.jvm.my.id.conf exists only for reaching the API by hand.

server {
    listen 80;
    listen [::]:80;

    # dev.jvm.my.id is the app itself. The wildcard is the tenant subdomains —
    # namaklinik.jvm.my.id — which land here so the Next proxy can redirect each
    # to its organization's pages. Drop the wildcard if *.jvm.my.id is meant to
    # be served by the production block in jvm.my.id.conf instead.
    server_name dev.jvm.my.id *.jvm.my.id;

    # Photos are the largest thing through here. The real limits are the
    # application's own (5 MB per file, 6 MB per server action); this sits above
    # them so an oversized upload is refused with the app's message, not a bare
    # nginx 413.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # $host, not $proxy_host: the tenant is the first label of the name the
        # browser asked for, and rewriting it here would erase which clinic was
        # meant before the Next proxy ever reads it.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        # Terminated at Cloudflare, so the scheme the app should believe in is
        # https regardless of the plain :80 this block listens on.
        proxy_set_header X-Forwarded-Proto https;

        # The client's X-Tenant is dropped. The backend accepts that header in
        # place of a subdomain, which is what makes local development work
        # without wildcard DNS; reaching the browser-facing edge it would let a
        # visitor name a tenant the host name did not. The front end sends its
        # own X-Tenant to the API server-side, over the compose network, well
        # out of reach of this.
        proxy_set_header X-Tenant "";

        proxy_read_timeout 60s;
    }
}
