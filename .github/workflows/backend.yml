# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy Backend CI/CD to Dev

# Only when the backend changes; the front end has its own workflow, and a
# commit that touches neither has nothing here to run. deploy/ is in the list
# because the compose file and its environment are what the deploy applies.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'Dockerfile'
      - 'deploy/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/deploy-dev.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'Dockerfile'
      - '.github/workflows/backend.yml'
      - '.github/workflows/deploy-dev.yml'

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest

    # The dependency submission API writes a snapshot to the repository, which
    # the default read-only GITHUB_TOKEN is not allowed to do.
    permissions:
      contents: write

    # The application boots every tenant DataSource on startup, so the tests
    # need a reachable MySQL on localhost:3306 with the credentials from
    # src/main/resources/application.properties. Flyway creates the schemas.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      # Redis backs the shared rate limit counters. Unlike MinIO it needs no
      # command, so it can be a service container.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # MinIO cannot be a service container: the image needs a "server /data"
    # command and services have no way to supply one. The storage tests upload
    # to it for real, so the endpoint, signing and path style settings are
    # covered rather than mocked.
    - name: Start MinIO
      run: |
        docker run -d --name minio \
          -p 9000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          minio/minio:latest server /data
        for attempt in $(seq 1 30); do
          if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
            echo "MinIO is up after ${attempt} attempt(s)"
            exit 0
          fi
          sleep 2
        done
        echo "MinIO never became healthy"
        docker logs minio
        exit 1

    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        # Turns a MinIO that failed to start into a build failure instead of a
        # silently skipped test.
        S3_INTEGRATION_REQUIRED: "true"
        # Same reasoning: a Redis that failed to start must fail the build rather
        # than leave its tests silently skipped.
        REDIS_INTEGRATION_REQUIRED: "true"

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8

  # Nothing reaches the dev server until the tests above pass, and never from a
  # pull request: the same commit deploys or it does not.
  deploy:
    name: Deploy
    needs: [ build ]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
