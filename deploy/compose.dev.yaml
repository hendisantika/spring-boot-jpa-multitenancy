# What runs on the dev server. Copied there by the deploy workflow, which also
# writes the .env beside it from GitHub secrets and variables — so this file is
# the only description of the deployment and there is nothing to edit by hand.
#
#   docker compose -f compose.dev.yaml up -d
#
# MySQL lives on the host and is reached at the address the URL template names.
# MinIO is an existing container on its own network, joined below. Redis is
# this deployment's own — the box has no shared one this app can use without a
# password it does not hold — so it is brought up here rather than depended on.
services:

  # A Redis of this deployment's own, unpublished and reachable only over the
  # compose network as `redis`. The application forces the REDIS rate-limit
  # backend in production, so it needs one that answers; standing up an
  # isolated container is cleaner than sharing the box's authenticated Redis,
  # whose password this app has no way to send.
  redis:
    image: redis:7-alpine
    container_name: multitenancy-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${API_IMAGE}
    container_name: multitenancy-api
    env_file: [ .env ]
    environment:
      # The credential check refuses to start on the values committed to the
      # repository, which is the point of setting it here: a missing secret
      # stops the deployment rather than quietly running on a public one.
      SPRING_PROFILES_ACTIVE: prod
    # The default network reaches redis and the front end; minio-net is the
    # existing network the MinIO container already sits on, joined so the
    # bucket answers at http://minio:9000.
    networks:
      - default
      - minio-net
    ports:
      # Bound to the loopback interface, because nginx on this host is what
      # serves the internet. Change to 0.0.0.0 to reach it from outside.
      - "${BIND_ADDRESS:-127.0.0.1}:8010:8080"
    extra_hosts:
      # MySQL is on the host; the URL template may name it by this alias.
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: multitenancy-frontend
    env_file: [ .env ]
    environment:
      # Over the compose network, not through the published port: the front end
      # calls the API server side, and this keeps that traffic off the host
      # interface entirely.
      BACKEND_URL: http://api:8080
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5000:3000"
    depends_on:
      # The health check is the jar's own, and it reports the database, so the
      # front end does not come up in front of an API that cannot serve.
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Created by the MinIO deployment, not by this one, so it is joined rather
  # than declared. If the box ever renames it, this is the one line to change.
  minio-net:
    external: true
    name: minio_minio-net
